name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            homeassistant: "homeassistant==2025.10.0"
            pymodbus: "pymodbus==3.11.2"
            constraints: tests/constraints-ha-2025.10.txt
          - python: "3.14"
            homeassistant: "homeassistant>=2025.10.0"
            pymodbus: "pymodbus>=3.11.2,<4.0"
            constraints: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            tests/constraints-ha-2025.10.txt
      - name: Install test dependencies
        env:
          HOMEASSISTANT: ${{ matrix.homeassistant }}
          PYMODBUS: ${{ matrix.pymodbus }}
          PIP_CONSTRAINT: ${{ matrix.constraints }}
        run: python -m pip install -r requirements-test.txt "$HOMEASSISTANT" "$PYMODBUS"
      - name: Run tests
        run: python -m pytest -q
